usageNote: >-
  Both of this console's frequencies passed into public record through
  statements Microsoft made at conferences rather than through any specification
  page, and this article carries both: the processor figure attributed to a
  Microsoft vice president speaking at an investor conference, the graphics
  figure as a direct quotation. The numbers are therefore Microsoft's, and the
  tier is the publication's — which is the ordinary case for a console whose
  maker published no specification document at all.
