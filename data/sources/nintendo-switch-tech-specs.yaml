usageNote: >-
  The only specification Nintendo publishes for this console, and it is cited
  here mostly for its silences. The CPU/GPU row reads "NVIDIA Custom Tegra
  processor" and stops: no frequency for either part, and no memory capacity
  anywhere on the page. Storage, battery and measured power consumption are
  stated. The page carries several models in separate tables and only the
  HAC-001(-01) console is read onto this record.
