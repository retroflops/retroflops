usageNote: >-
  Nintendo's own specification table for this console, in Japanese, and no
  longer hosted at its original address — the capture is cited because the
  document is Nintendo's, not the archive's. It is used mostly for what it
  withholds. The processor and graphics rows name a supplier and an architecture
  family and no frequency for either, and the table has no main-memory row at
  all: the storage figure it does give is the console's flash, which is a
  different quantity. The English-language Nintendo sites never carried an
  equivalent table.
