usageNote: >-
  The counterpart page for the Super Nintendo, and a fuller table than the
  Nintendo Entertainment System's: it gives the memory in bits, states the video
  memory separately, and puts a range on the cartridge size — the only vendor
  statement this catalog has for that question on any cartridge machine. The
  processor frequency it names is one of several this console genuinely runs at,
  depending on which memory region is being addressed, and the measurement says
  which.
