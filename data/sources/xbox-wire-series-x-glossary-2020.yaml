usageNote: >-
  Published the same day as the specification table and answering the question
  the table leaves open. The specification row reads only '12 TFLOPS', which
  names no precision and is therefore unusable as an FP32 rate; the glossary,
  defining the same term for the same console, says the precision outright. A
  vendor's silence in one document is worth re-testing against the rest of what
  it published that day.
