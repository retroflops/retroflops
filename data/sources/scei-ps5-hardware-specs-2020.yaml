usageNote: >-
  The only specification table Sony has published for the PlayStation 5, and it
  was published eight months before the console shipped. Its own headline says
  [UPDATED] and the table has been edited since — the graphics rate now reads
  10.3 TFLOPS where the March 2020 article read 10.28, and the compute-unit
  count is gone — so it is treated throughout as a pre-launch document that is
  still being revised, which is what holds every figure taken from it
  provisional.
