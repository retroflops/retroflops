usageNote: >-
  The counterpart to the PlayStation 4 safety guide, and the answer to a
  question the PlayStation 5 specification table does not touch. The same table
  also gives the console's electrical rating as 100-240 V, 3.55-1.5 A, and
  describes the GPU as '10 TFLOPS' with no precision named — a figure that is
  neither the 10.28 nor the 10.3 the specification blog has carried, and that is
  not usable as an FP32 rate.
