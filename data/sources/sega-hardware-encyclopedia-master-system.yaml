usageNote: >-
  Cited for an absence rather than a figure. The page states an electrical
  rating, but for the Japanese MK-2000 of October 1987, and then sets out how
  the overseas machine released a year earlier differs — no FM sound, no 3-D
  glasses port, no rapid-fire circuit. This catalog's Master System is the 1986
  machine, so the page documents both that a vendor figure exists and that it
  belongs to another console.
