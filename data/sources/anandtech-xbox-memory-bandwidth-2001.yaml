usageNote: >-
  AnandTech closed in 2024 and the original address no longer answers, so the
  figure is cited from a Wayback capture of 8 March 2016. The article reaches
  6.4 GB/s from the memory parts it found in a retail console — 5ns Samsung
  chips at 200MHz DDR across NVIDIA's 128-bit TwinBank — which is a different
  route to the number than GameSpot's, and that is what makes the two
  independent.
