usageNote: >-
  Cited for what this datasheet specifies instead of a thermal rating: supply
  current in milliamps. Any watt figure for this part is a reader's
  multiplication of current by voltage, not something Intel printed. The page is
  a scan whose column alignment did not survive optical recognition — the
  maximum Icc values sit in a column the text layer drops — so only the typical
  currents in note 3 can be transcribed from the text, and the maxima would have
  to be read off the image.
