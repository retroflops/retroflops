usageNote: >-
  Published three months before the console shipped and never contradicted by
  Nintendo, who has still published no frequency for this machine. The article
  distinguishes two things the catalog must keep apart: the clocks the writer
  states as confirmed for retail hardware, and a leaked developer specification
  table it reproduces and criticizes. Only the first is used for the clocks; the
  table is cited for the memory capacity, which the article treats as
  uncontested.
