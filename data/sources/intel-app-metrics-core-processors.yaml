usageNote: >-
  An export-control matrix, published so that a reader can assess a processor
  against the US Export Administration Regulations. It states a GFLOPS figure
  per part and nowhere in its twenty-four pages names a precision: the word
  appears in no column header, no footnote and no explanatory paragraph. The
  figures are therefore unusable for any metric that requires a stated
  precision, and the document says its own numbers are "strictly a
  recommendation to the user" and are provided as is.
