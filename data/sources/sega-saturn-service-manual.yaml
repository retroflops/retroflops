usageNote: >-
  Sega's own service manual, held by an enthusiast archive that is the custodian
  and not the author — the same footing on which this project cites the Internet
  Archive. It documents model MK-80200-50, the PAL console, so its processor
  frequency is the PAL one and differs from the rate the Japanese machine runs
  at; every figure read from it names the model. The scan carries an
  optical-character layer whose quality varies, and transcriptions note where it
  does. Its power rating disagrees with the figure Sega's own hardware
  encyclopedia gives, which is recorded as a conflict rather than resolved by
  preferring one document.
