usageNote: >-
  Nintendo's own specification table for this console, still published, and the
  only one this project has found. It states a single processor frequency and
  names no region, although the console shipped with different crystals in
  different territories — a distinction the catalog's record makes and this
  document does not. Its figure is also not the one that circulates. Both facts
  are carried on the measurement rather than resolved here, because the
  manufacturer's statement is the manufacturer's statement.
