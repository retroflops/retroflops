usageNote: >-
  The provenance is unusual and the article says so in its own headline: the
  frequencies come from a hacker reading them out of the shipped console, and
  the publication reports them under the word "report" while explaining who he
  is and why the figures carry weight. That is a chain this catalog can describe
  but not upgrade — one publication stating a figure it did not itself measure —
  so the frequencies stay provisional. Nintendo has never published a frequency
  for this console to compare them against.
