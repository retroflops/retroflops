usageNote: >-
  Dhrystone has no governing body and therefore no official result list; this
  collection, compiled by Aburto and hosted by Netlib since the 1980s, is the
  nearest thing to one. It is treated as tier B rather than as an official
  result for exactly that reason, so a figure taken from it alone stays
  provisional. Its value here is the column headings: the table separates
  version 1.1 from version 2.1 by construction, which is what makes a row
  citable at all under a metric that refuses a Dhrystone figure without a
  version.
