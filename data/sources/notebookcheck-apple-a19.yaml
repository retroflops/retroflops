extract: >-
  The Apple A19 integrates six CPU cores with two performance cores at up to
  4.26 GHz and four efficiency cores at up to 2.6 GHz. The iPhone 17 row lists 8
  GB RAM; the LPDDR5X-8533 controller is stated at up to 68.26 GB/s.
