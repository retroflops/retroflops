usageNote: >-
  Published to satisfy European ecodesign regulation rather than to describe the
  console, which is why it states an electrical rating Nintendo's product pages
  never give. It rates the adapter, not the machine: Nintendo's companion
  consoles page reports the Switch drawing 7 W while actively gaming, so this
  figure describes what the supply can deliver and not what the console takes.
