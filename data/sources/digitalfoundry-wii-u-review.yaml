usageNote: >-
  A review of retail hardware whose specification table states the memory
  capacity together with the part it is made of. The same publication's teardown
  piece calls the module size a best guess; this table does not hedge, and it is
  the table that is cited. Nintendo's own specification page has no memory row
  at all, which is why a review is carrying this figure.
