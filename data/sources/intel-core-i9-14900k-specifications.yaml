usageNote: >-
  A living product record with no publication date and no revision, so a figure
  taken from it is a figure as of the day it was read. Its Max Memory Bandwidth
  is the rating of the processor's memory interface at the fastest memory type
  it supports, not a measurement of traffic and not a property of any fitted
  module; the same page lists a slower DDR4 option that the rating does not
  describe.
