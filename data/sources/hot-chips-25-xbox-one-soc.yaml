usageNote: >-
  The slides are rasterized images, so the figures were read from rendered pages
  rather than extracted as text. Presented in August 2013 about the console that
  shipped that November, which is why it is preferred over Microsoft's later
  Xbox One S specification page: the One S page states 68.26 GB/s for a
  different machine. Slide 6 gives the graphics processor as '1.31 TFLOPs' with
  no precision named, which is why the FP32 row stays unknown.
