usageNote: >-
  The safety guide, not the press release, is where Sony states a console's
  electrical rating. Sony's launch announcements describe the PlayStation 4 by
  architecture and core count and give no wattage at all; this document gives
  one, and it is model-coded, so the figure belongs to the CUH-1001A chassis and
  not to later revisions.
