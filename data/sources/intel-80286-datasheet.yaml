usageNote: >-
  Three things travel with any quotation from this document. Its only wattage,
  3.3 W, is an absolute maximum: the same page says "These are stress ratings
  only" and that operation beyond the Operating Conditions is not recommended,
  so it is a destruction limit and not a thermal-design figure. Its file name
  says revision 016 while the document's own footer says Order Number
  210253-018, September 1993 — the footer is the identifier to trust. And the
  copy on this mirror carries a third-party "DataSheet4U.com" watermark across
  its pages: the content, folios and microfiche header are Intel's, but the file
  has passed through a datasheet aggregator on its way here. It has no text
  layer at all and a damaged cross-reference table, so every figure from it has
  to be rendered and read by eye.
