  A review of retail hardware published the day before the German launch, and
  the second source for this console's frequencies and memory capacity — it
  states both clocks in prose and repeats the processor one in a table comparing
  three consoles. It is deliberately not the source for a power rating: the
  review meters the console's draw, which is a different quantity from the
  rating this catalog records as unknown.
