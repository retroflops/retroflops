usageNote: >-
  This datasheet predates Intel's "thermal design power" wording. It states a
  typical in-system dissipation and a maximum active power dissipation that
  systems must be designed to remove, and the maximum is defined by note 2 as a
  worst-case instruction mix rather than a reproducible benchmark. Retrieved
  from chipdb's Intel datasheet mirror, which is the custodian, not the author:
  the tier follows Intel, and the copy carries Intel's own order number and June
  1997 date.
