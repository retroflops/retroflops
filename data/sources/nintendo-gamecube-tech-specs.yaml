usageNote: >-
  Nintendo's Spanish-language hardware-history section still carries the full
  GameCube specification table that the English pages dropped. It is the
  manufacturer's own document, and it is the reason the console's main-memory
  bandwidth no longer rests on technical journalism. The same table states a
  10,5 GFLOPS figure that explicitly totals the MPU, Geometry Engine and
  hardware lighting and names no precision, which is why the console's FP32 row
  stays unknown.
