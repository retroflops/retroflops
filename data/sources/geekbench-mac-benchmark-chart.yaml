usageNote: >-
  The benchmark's own publisher, which is what makes it a tier A result rather
  than an aggregator's table. Two things about it are unusual enough to be
  recorded on every figure taken from it. It is a rolling average — the page
  says so itself, and says when it was last recomputed — so a figure read from
  it is a dated snapshot and never a current value. And browser.geekbench.com
  refuses automated requests outright, so the fetched address is a Wayback
  capture; here the archive is not a fallback but the mechanism, because a
  capture is dated by construction and that is exactly what a snapshot of a
  moving number needs.
