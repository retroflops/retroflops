usageNote: >-
  Fetched for the first time on 15 August 2026, and the retrieval is the
  finding: the address now redirects to NVIDIA's 20-series landing page, which
  carries none of this card's figures. A Wayback capture of the original address
  from 20 August 2018 does carry the launch table, and reading it raises a
  second question this record cannot settle on its own — the table gives 1635
  MHz (OC) for the Founders Edition and 1545 MHz for the standard card, while
  the catalog records 1635 MHz against a record titled reference. The base
  clock, the thermal design power and the floating-point rate are on neither
  page. Held for the round that curates the graphics cards.
