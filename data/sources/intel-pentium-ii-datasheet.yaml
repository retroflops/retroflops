usageNote: >-
  Two things travel with any quotation from this table. It separates Max
  Processor Power from Max Thermal Plate Power, which are different quantities
  for the same part, and each row carries a stepping footnote — the 300 MHz
  row's note 4 restricts the specification to CPU ID 63x. The mirrored copy is a
  pre-publication revision, stamped "INTEL CONFIDENTIAL (until publication
  date)" on its cover and "INTEL SECRET" on its pages; it is Intel's own
  document under Intel's own order number, but it is the draft rather than the
  released print. Retrieved from chipdb's Intel datasheet mirror, custodian
  rather than author.
