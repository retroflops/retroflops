- extract: >-
    The Samsung chips used on our unit are 5ns parts that run at 200MHz DDR
    offering the effective bandwidth of a 400MHz solution. When combined with
    NVIDIA's 128-bit TwinBank memory architecture this offers a total of 6.4GB/s
    of memory bandwidth that is to be shared between the IGP and the CPU.
