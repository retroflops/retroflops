  locator: '"Product Specifications" table, H100 SXM column'
  notes: >-
    The table has a column for the H100 SXM and one for the H100 NVL; only the
    SXM column is transcribed, and each row label is rejoined with its value by
    a colon. The BFLOAT16, FP8 and INT8 rows are omitted as formats the catalog
    has no metric for, and the asterisk footnote is kept because it changes what
    four of these figures mean. What makes this table unlike every other vendor
    figure in the catalog is the first column: each rate names the precision it
    was measured in.
