- id: apollo-11-mission-report:section-16:computer-alarms
  sourceId: apollo-11-mission-report
  locator: section 16, anomaly "Computer alarms during descent", p. 189
  extract: >-
    Five computer program alarms occurred during descent prior to the low-gate
    phase of the trajectory. The performance of guidance and control functions
    was not affected.

    The alarms were of the Executive overflow type, which signify that the
    guidance computer cannot accomplish all of the data processing requested in
    a computation cycle. The alarms indicated that more than 10 percent of the
    computation capacity of the computer was preempted by unexpected counter
    interrupts.
