- extract: >-
    • ASIC: Image drawing VLSI NEC HOLLY 100MHz, Audio YAMAHA AICA

    • Polygon performance: At peak 3 million polygons/sec (triangle /
    quadrilateral), 1.5 million polygons/sec visible

    • 16MB Main memory (Can expand to a maximum of 32MB)

    • 8MB Texture memory (Can expand to a maximum of 16MB)

    • 2MB Boot ROM

    • 2MB audio memory (Can expand to a maximum of 8MB)
  extractHash: da79403d0ea1f143399f03854adfb5e9d302d4a3e2d550714a05a123e7e83f70
  id: dc-hw:1-2:system-specification
  locator: section 1.2 "System specification", page 3
  notes: >-
    The scan renders "VLSI NEC" as "VLVNEC" and runs "8MBTexture" together; both
    corrected. Bullets for polygon functions, flash memory, audio functions and
    the GD-ROM drive are omitted as unused. The expansion maxima are the
    development-hardware ceilings, not retail configurations.
