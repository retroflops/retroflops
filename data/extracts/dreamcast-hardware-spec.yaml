- extract: >-
    Table 2-1 [...] Instruction core: 32bit RISC, 16bit Instruction

    Pipe line: 5 stage

    FPU: single/double accuracy IEEE754

    Clock: Internal 200 MHz, external 100 MHz, peripheral clock 50MHz

    Performance: 360MIPS (core), 1.4GFLOP (matrix multiplication)
  extractHash: f92f7c63f15b2be3a3aa0e8f0b16a115192b40f524022fd9be554a57284d1b14
  id: dc-hw:table-2-1:sh4
  locator: section 2.1 "Features of SH4", table 2-1, page 7
  notes: >-
    The scan lays the table out as a column of row labels followed by a column
    of values; the pairs are rejoined here with a colon. The superscalar row
    reads "2 i" and is omitted as unreadable. Neither performance figure states
    how it was obtained: "360MIPS (core)" names no benchmark and "1.4GFLOP"
    names no precision, though the FPU row above it offers both single and
    double.
  sourceId: dreamcast-hardware-spec
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-07-29
- extract: >-
    In order to take advantage of SH4 performance, the SDRAM (which is the main
    memory) is directly connected to SH4. The bus width is 64bit with a movement
    frequency of 100MHz and at burst, it has a maximum transfer quantity of
    800MB/S (a theoretical value) Additionally, SH4 does not share the texture
    data/audio data and the main memory SDRAM. There is 16MB of base system
    space.
  extractHash: 9b612ddc04e19f07c2f194babe45f0d305a66dc5bb9d53ec38d914f7b1db1524
  id: dc-hw:2-3:main-memory
  locator: section 2.3 "Main memory", page 8
  notes: >-
    Transcribed as printed, including the missing full stop after "(a
    theoretical value)". The statement that the SH4 does not share texture and
    audio data with main memory is the architectural point: this console has
    three separate memory pools where the Nintendo 64 has one.
  sourceId: dreamcast-hardware-spec
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-07-29
