  notes: >-
    In English: product name PLAYSTATION 3; CPU, Cell processor; GPU, RSX;
    memory, 256MB XDR Main RAM, 256MB GDDR3 VRAM; external dimensions
    approximately 325 × 98 × 274 mm (width × height × depth, excluding
    projections); mass approximately 5 kg. This is the specification of the
    console Sony launched, and what it leaves out is the point: it names the two
    processors without a clock for either, and states no floating-point figure
    at all. The rows for storage, ports, communications and optical drive are
    omitted here as outside the catalog's model.
