- extract: >-
    Welcome to the Geekbench Metal Benchmark Chart. The data on this chart is
    calculated from Geekbench 6 results users have uploaded to the Geekbench
    Browser. To make sure the results accurately reflect the average performance
    of each GPU, the chart only includes GPUs with at least five unique results
    in the Geekbench Browser.

    This chart was last updated about 2 hours ago.
  extractHash: 75195715b2c63c7dd43ade50b0e9929e44e8cddcc8a518e1c49fbc296fd6e6c0
  id: geekbench-metal-chart-2026-07-18:what-the-figures-are
  locator:
    Introductory paragraph above the chart, and the line immediately below it
  notes: >-
    Transcribed with no value: this is the record that says what kind of number
    the chart holds. An average over uploads of one graphics processor,
    recomputed continuously — the page dates its own last update — so a figure
    read from it is true of a day and of no other day. It also names the
    version, which is half the benchmark identity these figures carry.
  sourceId: geekbench-metal-benchmark-chart-2026-07-18
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-18
- extract: >-
    Geekbench 6 scores are calibrated against a baseline score of 2500 (which is
    the score of an Intel Core i7-12700 performing the same task). Higher scores
    are better, with double the score indicating double the performance.
  extractHash: 930b84128b0e2ea11b1e9bef4749064deb651223d6961fa417510c2942b14b84
  id: geekbench-metal-chart-2026-07-18:calibration
  locator: Second paragraph above the chart
  notes: >-
    The baseline is why a compute score is a metric of its own rather than a
    variant of the processor score. Version 6 calibrates both against 2500;
    version 7 splits them, calibrating a compute result against 100,000 and a
    processor result against 2,500, so the two scales are neither the same
    quantity nor stable across versions.
  sourceId: geekbench-metal-benchmark-chart-2026-07-18
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-18
