  locator: Table heading, above row 001
  notes: >-
    Transcribed with no value: this record exists to establish what the columns
    are. Two Dhrystone versions have their own columns, so a row states which
    version produced which figure — and a metric that refuses a Dhrystone number
    without a version can accept one from here. Column alignment is preserved
    because it is what associates a figure with a version; the leading spaces
    are the source's.
