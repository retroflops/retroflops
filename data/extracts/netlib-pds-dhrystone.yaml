- extract:
    328 Commodore 64           C64 ROM      6510          1.0    0.0205 ---   1
  extractHash: 7bcb595c28404e9e43003ec082308a0cfc06056937d048e03c37ad08eef92d6a
  id: netlib-dhrystone:commodore-64
  locator: Results table, row 328, the last row of the table
  notes: >-
    Read against the heading: 0.0205 sits under "MIPS V1.1" and the "---" under
    "MIPS V2.1" means the machine was never run on version 2.1. The clock column
    says 1.0 MHz, which is neither of the two rates this catalog records for the
    machine — the table rounds, and 0.98525 and 1.02273 both round to 1.0 — so
    the figure is not attached to either regional variant. "C64 ROM" in the OS
    column means the run used the machine's own ROM environment rather than a
    hosted operating system.
  sourceId: netlib-pds-dhrystone
  transcribed:
    significantDigits: 3
    state: value
    unit: DMIPS
    value: '0.0205'
  transcribedBy: RetroFlops editorial
