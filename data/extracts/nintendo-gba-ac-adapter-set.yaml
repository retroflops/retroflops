  notes: >-
    Transcribed with no value. "Power in: alternating current 230V / 50Hz. Power
    out: direct current 3V, 300 mA." The product of the output pair is 0.9 W,
    but it rates an optional accessory rather than the handheld, which ships
    running on two AA cells — so it describes what one way of powering the
    machine can supply, not what the machine was specified to draw.
