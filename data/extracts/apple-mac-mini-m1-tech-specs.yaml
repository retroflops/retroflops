- extract: >-
    Chip: Apple M1 chip

    8-core CPU with 4 performance cores and 4 efficiency cores

    8-core GPU

    16-core Neural Engine

    Memory: 8GB unified memory

    Configurable to: 16GB
  extractHash: 75b22ebdbaf52523d84f9e1d1f3882cd2634b3b9565297e50806f18119aeb294
  id: apple-mac-mini-m1:chip-and-memory
  locator: '"Chip" and "Memory" sections'
  notes: >-
    The page lays each section out as a heading followed by its lines; the
    headings are rejoined here with a colon. "8GB" and "16GB" mean 8 GiB and 16
    GiB. The whole of the chip section is quoted, and it contains no frequency
    for either the processor or the graphics cores.
  sourceId: apple-mac-mini-m1-tech-specs
  transcribed:
    significantDigits: 1
    state: value
    unit: GiB
