- extract: >-
    Line voltage: 100–240V AC

    Frequency: 50Hz to 60Hz, single phase

    Maximum continuous power: 150W

    Operating temperature: 50° to 95° F (10° to 35° C)
  extractHash: 5a5663ce7865645db6eeea110630d70a457b2325073ac30239109019a58f4183
  id: apple-mac-mini-m1:electrical
  locator: '"Electrical and Operating Requirements" section'
  notes: >-
    "Maximum continuous power" is what the machine may draw, not what it does
    draw; the same page states no consumption figure for any workload. It is
    recorded for the same reason the PlayStation 2's 79 W is — a rating is what
    these vendors publish — and the metric forbids ratios for exactly that
    reason.
  sourceId: apple-mac-mini-m1-tech-specs
  transcribed:
    significantDigits: 2
    state: value
    unit: W
    value: '150'
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-07-29
