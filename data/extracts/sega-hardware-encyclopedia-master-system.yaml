  notes: >-
    Transcribed with no value. "DC9V/850mA (using the dedicated AC adapter
    supplied with the unit)". The 型番 row is what disqualifies it here: MK-2000
    is the Japanese Master System of 18 October 1987, and this catalog's record
    is the overseas machine of 1986. The same page states that the two differ in
    hardware, so the rating cannot be carried across.
