  notes: >-
    Each row label is rejoined with its value by a colon and the section
    headings are kept, because they are what the two rate figures belong to.
    Neither is a floating-point rate: "3352 AI TOPS" counts integer or
    low-precision tensor operations and "318 TFLOPS" is the ray-tracing
    engine's, so neither is recorded and neither may be divided by anything the
    GeForce GTX 1080 states. The rows for display, dimensions and software
    support are omitted.
