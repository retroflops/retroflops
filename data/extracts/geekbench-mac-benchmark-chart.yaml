- extract: >-
    The data on this chart is calculated from Geekbench 6 results users have
    uploaded to the Geekbench Browser. To make sure the results accurately
    reflect the average performance of each Mac, the chart only includes Macs
    with at least five unique results in the Geekbench Browser.

    This chart was last updated about 17 hours ago.
  extractHash: 92a1731228e1d0757116423a4f11a523f68f3e1b04ef5d275036aae0c0d0cd65
  id: geekbench-mac-chart:what-the-figures-are
  locator:
    Introductory paragraph above the chart, and the line immediately below it
  notes: >-
    Transcribed with no value: this is the record that says what kind of number
    the chart holds. An average over uploads, recomputed continuously — the page
    dates its own last update — so a figure read from it is true of a day and of
    no other day. That is the whole reason these figures carry a method of their
    own and an as-of date, and never divide into somebody's single run.
  sourceId: geekbench-mac-benchmark-chart
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-04
