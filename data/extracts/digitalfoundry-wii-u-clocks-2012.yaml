  id: df-wii-u:clocks
  locator: Body text, the quoted post reproduced in full
  notes: >-
    The publication is quoting a hacker who read these out of the shipped
    console, and the precision is the point of the quote: six decimal places is
    what measurement looks like against a vendor's silence. The catalog records
    1.24 GHz and 550 MHz, which is what the publication's own headline states
    and what the extra digits round to; carrying 549.999755 MHz forward would
    claim a precision about the console that only describes one reading of one
    machine.
