  locator: >-
    Section 5, Table 5-1 "Processor Thermal Design Power", page 69, "800 MHz FSB
    with 512-KB L2 Cache Only" block, Processors with multiple VIDs, 3 GHz row
  notes: >-
    The table is a grid of frequency lists against wattage lists, so the 3 GHz
    figure is positional: fourth of the six frequencies in the 800 MHz FSB
    block, fourth of the six wattages. Two neighboring numbers are close enough
    to be mistaken for corroboration and are not — 81.8 W belongs to the 3.06
    GHz part on the 533 MHz bus, and 82.0 W to the 3.20C GHz part on the same
    800 MHz bus. A 3 GHz row appears in no other block: on this datasheet's
    evidence the frequency exists only with the 800 MHz front side bus.
