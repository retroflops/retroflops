- extract: >-
    ABSOLUTE MAXIMUM RATINGS* / Ambient Temperature Under Bias .... 0°C to +70°C
    / Storage Temperature ........... −65°C to +150°C / Voltage on Any Pin with
    Respect to Ground ............. −1.0V to +7V / Power Dissipation
    ........................ 3.3W — *WARNING: Stressing the device beyond the
    "Absolute Maximum Ratings" may cause permanent damage. These are stress
    ratings only. Operation beyond the "Operating Conditions" is not recommended
  extractHash: b2be0df01f98141ccf08f4a8ee42b608bdfd85f611e0bf9304f6d21b35e5b379
  id: intel-80286-datasheet:absolute-maximum-power-dissipation
  locator: >-
    Printed page 2-99 (PDF page 40 of 56), ABSOLUTE MAXIMUM RATINGS block and
    the warning printed beside it
  notes: >-
    Transcribed to record that the wattage exists and cannot be used. This is
    the one period x86 datasheet in the catalog that prints watts for a part
    whose thermal design power is being asked about, and it prints them as a
    stress rating the document itself disclaims in the adjoining paragraph. The
    number is also not independent of the supply current in the table below it:
    600 mA at the 5.25 V top of the tolerance is 3.15 W, so 3.3 W is that same
    ceiling rounded up rather than a separately characterized cooling target.
    Read by rendering the page at 200 dpi, the file having no text layer.
  sourceId: intel-80286-datasheet
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-16
