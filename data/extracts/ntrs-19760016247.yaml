- id: ntrs-19760016247:table-1
  sourceId: ntrs-19760016247
  locator: page 26, table I "Computer characteristics"
  extract: >-
    TABLE I.- COMPUTER CHARACTERISTICS

    Performance characteristic / Block I / Block II

    Word length, bits: 15 plus parity / 15 plus parity

    Number system: 1's complement / 1's complement

    Fixed-memory registers, words: 24 576 / 36 864

    Erasable-memory registers, words: 1024 / 2048

    Number of normal instructions: 11 / 34

    Memory-cycle time, µsec: 11.7 / 11.7

    Addition time, µsec: 23.4 / 23.4

    Multiplication time, µsec: 117 / 46.8

    Weight, kg (lb): 39.4 (87) / 31.7 (70)

    Power consumption, W: 100 / 70
  extractHash: cf7959f5956550a9a403f6f4ddc3aa24d689b894afd42249da5c012ad2b6910d
  transcribedOn: 2026-07-28
  transcribedBy: RetroFlops editorial
  notes: >-
    Transcribed from the text layer of the scanned NTRS PDF. The table lists
    Block I and Block II side by side; the second value in each row is Block II.
    Dot leaders between the row label and its values are collapsed to a colon,
    and the rows not used by this dataset (involuntary instructions, interrupt
    options, counters, interface circuits, double-precision addition time, logic
