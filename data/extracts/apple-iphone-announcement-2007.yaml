- extract: >-
    Pricing & Availability iPhone will be available in the US in June 2007,
    Europe in late 2007, and Asia in 2008, in a 4GB model for $499 (US) and an
    8GB model for $599 (US), and will work with either a PC or Mac.
  extractHash: a82fe457e7cb84fbefe83f733e13005411aa3150640354b5abe0769eae5c0d4a
