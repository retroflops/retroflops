  locator: Section "Pricing & Availability"
  notes: >-
    The whole of what Apple said about the machine's numbers on the day it was
    announced. There is no processor, no frequency, no memory: the two
    capacities are storage, and they are the only quantities in the release.
    Transcribed in decimal gigabytes as written, unlike a memory capacity, which
    this catalog reads as binary — makers state flash decimally.
