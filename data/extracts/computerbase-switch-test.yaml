- extract: >-
    Dem SoC stehen 4 GByte RAM zur Seite, der interne Speicher beläuft sich auf
    32 GByte, die per microSD-Karte erweitert werden können.
  extractHash: c40cc60f9bd90f2fb293c510b73cd63c0ac0133ecc095784b31b8e3f09981360
  id: computerbase-switch:ram
  locator: '"Die Technik der Switch" section, paragraph on the Tegra SoC'
  notes: >-
    Stated flatly about the shipped console, in a review published after
    release, and it agrees with the capacity Digital Foundry's reproduced
    developer table gives. "GByte" is this publication's own spelling of the
    binary quantity, as memory has always been sold.
  sourceId: computerbase-switch-test
