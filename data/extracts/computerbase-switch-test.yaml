- extract: >-
    Einzelheiten hierzu sind allerdings offiziell bisher nicht bekannt gegeben
    worden; lediglich von Entwicklern genannte Taktraten, die noch nicht
    bestätigt wurden, sind nach außen gelangt.
  extractHash: 200c6fe2ac34cab432ad936732fef10ed08acad41aef1fe4f82cbd82eb092a37
  id: computerbase-switch:clocks-undisclosed
  locator: >-
    "Mehr GPU-Takt im TV-Modus" section, after the statement that the SoC runs
    faster docked than in tablet mode
  notes: >-
    Transcribed with no value, because its value to this catalog is the refusal.
    Reviewing the shipped console, the publication says the frequencies were
    never officially disclosed and that what leaked were unconfirmed developer
    figures. That is the second source declining to state what the first states,
    so the clocks stay provisional on one source rather than approved on two —
    and this record is what a reader is shown instead of an unexplained status.
  sourceId: computerbase-switch-test
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-15
