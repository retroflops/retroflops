  notes: >-
    The table compares the GTX 980 with the GTX 1080; only the GTX 1080 column
    is transcribed, each row label rejoined with its value by a colon, and the
    superscript footnote marker written as " 1". This is the only NVIDIA
    document in the catalog that states a floating-point rate for this card, and
    its footnote is what makes the rate legible: 8873 GFLOPs is the boost clock
    multiplied out, not the base clock.
