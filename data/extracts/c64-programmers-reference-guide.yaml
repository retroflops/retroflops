- extract: >-
    Floating-point numbers are stored (using five bytes of memory) and are
    manipulated in calculations with ten places of accuracy. However, the
    numbers are rounded to nine digits when results are printed.
  extractHash: c032ca5ea5f88d1da0b405b1664b8ba7ed2d0931aaf80a0d42716bc43bf4cced
  id: c64-prg:p6:floating-point-format
  locator: page 6, "Floating-point constants"
  notes: >-
    Five bytes establishes a 40-bit storage format. Ten decimal places of
    calculation accuracy does not make it IEEE single or double precision. The
    guide gives no benchmark run, so it supports the format classification but
    not a sustained rate.
  sourceId: c64-programmers-reference-guide
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-24
