  locator: Section "Pricing and Availability"
  notes: >-
    The same two capacities as the January announcement, restated the day before
    the phone reached buyers. It is cited for the storage figures rather than
    the announcement because it describes hardware that was already in the
    shops, and it fixes the release date to the hour.
