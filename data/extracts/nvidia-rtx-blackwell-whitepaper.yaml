- extract: >-
    The full GB202 chip consists of 92.2 billion transistors and contains 12
    GPCs, 96 TPCs, 192 SMs, and sixteen 32-bit memory controllers (512-bit
    total).
  extractHash: cc1fc0d233b6e92ea14bb2425754fa3b87bd9236fe4bf651a6f8f26d92322597
  id: nvidia-rtx-5090:gb202-die
  locator: Appendix A “Blackwell GB202 GPU”, opening paragraph
  notes: >-
    This sentence describes the full die, which has 192 SMs; the GeForce RTX
    5090 in the same appendix's table has 170. NVIDIA nevertheless prints 92.2
    billion in the card's own column, so the count recorded for the card is the
    full die's on the vendor's own authority — stated in the caveat rather than
    silently narrowed. The memory interface is the same 512 bits in both.
  sourceId: nvidia-rtx-blackwell-whitepaper
  transcribed:
    significantDigits: 3
    state: value
    unit: transistor
    value: '92200000000'
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-04
