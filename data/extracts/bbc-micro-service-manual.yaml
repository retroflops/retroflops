- extract: >-
    Every 250 nanoseconds, control of the RAM address lines is switched between
    the microprocessor and the CRTC. Thus, in each one microsecond period, the
    microprocessor has two RAM accesses and the CRTC has two RAM accesses.
  extractHash: 4ea95aba2ea2b6600e1dac69b1b3a432409cd02831d4e493bc290168840b77dd
