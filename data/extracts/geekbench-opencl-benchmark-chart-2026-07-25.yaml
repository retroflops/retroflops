- extract: >-
    Welcome to the Geekbench OpenCL Benchmark Chart. The data on this chart is
    calculated from Geekbench 7 results users have uploaded to the Geekbench
    Browser. To make sure the results accurately reflect the average performance
    of each GPU, the chart only includes GPUs with at least five unique results
    in the Geekbench Browser.

    This chart was last updated about 2 hours ago.
  extractHash: fe572c4915d309406c7096e947613c258f0bb156013332f4270accc070d2588e
  id: geekbench-opencl-chart-2026-07-25:what-the-figures-are
  locator:
    Introductory paragraph above the chart, and the line immediately below it
  notes: >-
    The same rolling average as the Metal chart, and read the same way: a figure
    true of one day. This capture is nine days younger than the Metal one and
    already runs version 7, which is why the two APIs enter this catalog under
    different versions.
  sourceId: geekbench-opencl-benchmark-chart-2026-07-25
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-18
- extract: >-
    Geekbench 7 CPU scores are calibrated against a baseline score of 2,500
    (which is the score of an AMD Ryzen 7 7700).

    Geekbench 7 GPU scores are calibrated against a baseline score of 100,000
    (which is the score of an NVIDIA GeForce RTX 4060).
  extractHash: 9d22dc3205f6b0f69b5ce0c8df653e6830e88eee82a20a3b836d68cc580f768b
  id: geekbench-opencl-chart-2026-07-25:calibration
  locator: Second and third paragraphs above the chart
  notes: >-
    Version 7 states in two sentences why a compute score and a processor score
    are not one quantity: the baselines differ by a factor of forty, so a
    machine reporting both would otherwise look forty times faster at graphics
    than at arithmetic for no reason but the calibration.
  sourceId: geekbench-opencl-benchmark-chart-2026-07-25
  transcribedBy: RetroFlops editorial
  transcribedOn: 2026-08-18
