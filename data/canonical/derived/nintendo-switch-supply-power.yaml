id: nintendo-switch:supply-power
formula:
  id: power-from-voltage-current
  version: '1'
  expression: voltage × current
inputMeasurementIds:
  - nintendo-switch:supply-voltage
  - nintendo-switch:supply-current
result:
  state: value
  value: '39'
  unit: W
  significantDigits: 2
rounding: half-up
caveat: >-
  Multiplies the two halves of a supply rating the maker published instead of a
  wattage. The arithmetic is exact for direct current — no power factor, nothing
  assumed — so this is not an estimate. It is still a rating and not a draw: a
  supply is specified for the worst case with headroom above it, and a machine
  at rest or at play may use a small fraction of it. Reported to 2 significant
  digits, the precision of the less precise of the two published figures.
editorialStatus: approved
notes: >-
  The same 39 W as the GameCube's, from a document written for an entirely
  different reason: an ecodesign disclosure required by regulation, listing the
  HAC-002 adapter's two output modes. The coincidence is worth nothing and the
  provenance is worth a great deal — this is the only place Nintendo states the
  Switch's supply in figures that multiply.
