caveat: >-
  Adds 1 memory-capacity figure obtained by design-capacity. Left out:
  {{measurement:ps3-gddr3:capacity}} (the RSX’s own pool, which the processor
  cannot spend on its own work). A total is only as trustworthy as the decision
  about what belongs in it, so both the terms and the exclusions are named
  records.
