id: amiga-1200:whole-system-memory
formula:
  id: sum
  version: '1'
  expression: a + b + …
inputMeasurementIds:
  - amiga-1200-chip-ram:capacity
exclusions:
  - measurementId: amiga-1200-kickstart-rom:capacity
    label: 512 KiB of Kickstart ROM
    reason: read-only firmware, not memory the machine can write to
result:
  state: value
  value: '2097152'
  unit: B
  significantDigits: 7
rounding: none
caveat: >-
  Adds 1 memory-capacity figure obtained by design-capacity. Left out:
  {{measurement:amiga-1200-kickstart-rom:capacity}} (read-only firmware, not
  memory the machine can write to). A total is only as trustworthy as the
  decision about what belongs in it, so both the terms and the exclusions are
  named records.
editorialStatus: approved
