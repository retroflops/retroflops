caveat: >-
  Adds 2 memory-capacity figures obtained by design-capacity. Left out:
  {{measurement:super-nintendo:cartridge-storage-capacity}} (removable program
  storage, not memory the console can write to). A total is only as trustworthy
  as the decision about what belongs in it, so both the terms and the exclusions
  are named records.
editorialStatus: approved
exclusions:
  - label: removable game-cartridge ROM
    measurementId: super-nintendo:cartridge-storage-capacity
    reason: removable program storage, not memory the console can write to
formula:
  expression: a + b + …
  id: sum
  version: '1'
id: super-nintendo:whole-system-memory
inputMeasurementIds:
  - snes-ram:capacity
  - snes-video-ram:capacity
result:
  state: value
  value: '196608'
  unit: B
  significantDigits: 6
rounding: none
