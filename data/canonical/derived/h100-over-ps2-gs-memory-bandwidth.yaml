id: nvidia-h100:over-playstation-2-gs-memory-bandwidth
formula:
  id: ratio
  version: '1'
  expression: a ÷ b
inputMeasurementIds:
  - nvidia-h100-memory:bandwidth
  - ps2-gs-edram:bandwidth
result:
  state: value
  value: '70'
  unit: unit
  significantDigits: 2
rounding: half-up
caveat: >-
  Compares memory-bandwidth at memory scope, obtained by theoretical-peak. Valid
  only within this comparability group, and reported to 2 significant digits —
  the precision of the least precise input. At least one input is a theoretical
  peak, which is an upper bound rather than an achieved result.
editorialStatus: approved
