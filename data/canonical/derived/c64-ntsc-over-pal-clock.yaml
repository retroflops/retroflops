id: commodore-64:ntsc-over-pal-clock
formula:
  id: ratio
  version: '1'
  expression: a ÷ b
inputMeasurementIds:
  - commodore-64:ntsc:clock-frequency
  - commodore-64:pal:clock-frequency
result:
  state: value
  value: '1.0380'
  unit: unit
  significantDigits: 5
rounding: half-up
caveat: >-
  Compares clock-frequency at cpu scope, obtained by nominal-clock. Valid only
  within this comparability group, and reported to 5 significant digits — the
  precision of the least precise input.
editorialStatus: approved
