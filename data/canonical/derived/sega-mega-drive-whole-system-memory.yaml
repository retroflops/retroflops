caveat: >-
  Adds 1 memory-capacity figure obtained by design-capacity. Left out:
  {{measurement:sega-mega-drive:cartridge-storage-capacity}} (removable program
  storage, not memory the console can write to). A total is only as trustworthy
  as the decision about what belongs in it, so both the terms and the exclusions
  are named records.
editorialStatus: provisional
exclusions:
  - label: removable game-cartridge ROM
    measurementId: sega-mega-drive:cartridge-storage-capacity
    reason: removable program storage, not memory the console can write to
formula:
  expression: a + b + …
  id: sum
  version: '1'
id: sega-mega-drive:whole-system-memory
inputMeasurementIds:
  - mega-drive-ram:capacity
result:
  significantDigits: 5
  state: value
  unit: B
  value: '65536'
rounding: none
