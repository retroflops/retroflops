id: sony-playstation-4:launch-price-july-2026-usd
formula:
  id: price-adjusted-by-cpi
  version: '1'
  expression: nominal price × target CPI-U ÷ launch CPI-U
inputMeasurementIds:
  - sony-playstation-4:launch-price
constants:
  - id: target-cpi-u
    label: CPI-U for July 2026
    value: '333.918'
    reason: The target month in the frozen CPI-U snapshot.
    sourceIds:
      - bls-cpi-u-july-2026
  - id: launch-cpi-u
    label: CPI-U for November 2013
    value: '233.069'
    reason: The month the PlayStation 4 went on sale in the United States.
    sourceIds:
      - bls-cpi-u-july-2026
result:
  state: value
  value: '572'
  unit: USD
  significantDigits: 3
rounding: half-up
caveat: >-
  Multiplies the nominal U.S. list price by CPI-U for July 2026 and divides by
  CPI-U for November 2013. The original price remains the cited launch figure.
  CPI-U adjusts for U.S. consumer prices; it does not convert currencies or
  markets. Reported to 3 significant digits, the precision of the nominal price.
editorialStatus: approved
