id: zx-spectrum-48k
slug: zx-spectrum-48k
name: ZX Spectrum 48K
manufacturer: Sinclair Research
type: home-computer
releaseDate: 1982-04
region: United Kingdom
summary: >-
  A Z80A home computer with Sinclair BASIC in ROM and a ULA that drives the
  display. Each key carries a whole BASIC keyword, so a program is typed in
  rather than spelled out.
description: >-
  Sinclair pushed almost everything outside the processor into a single custom
  chip, which is how the machine reached a price no rival matched. That chip
  also pauses the processor while it reads video memory, and the resulting
  contention is why one part of memory runs slower than the rest.
