      - componentId: ps2-iop
        role: co-processor
        count: 1
        shared: false
        notes: >-
          Drives the console's inputs and outputs, and becomes the whole machine
          when a PlayStation disc is playing.
        measurementIds:
          - sony-playstation-2:cpu-clock-frequency
notes: >-
  The release date is editorial context: the cited specification release is
  dated March 1999 and states only an intention to launch during the following
  fiscal year. Sony's polygon figures, 66 million per second of geometry on the
  Emotion Engine and 75 million per second of drawing on the Graphics
  Synthesizer, are not recorded because the catalog has no polygon-rate metric.
  The rated power consumption is the SCPH-39001 revision's; later revisions drew
  considerably less, and the 2003 single-chip release puts the launch pair of
  chips at {{context:sony-playstation-2:context-w-37}} between them.
