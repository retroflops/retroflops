      - componentId: ps2-main-rdram
        role: system-memory
        count: 1
        shared: false
        notes: Direct Rambus DRAM, reachable by the Emotion Engine.
        measurementIds:
          - ps2-main-rdram:capacity
      - componentId: ps2-gs-edram
        role: video-memory
        count: 1
        shared: false
        notes: On the Graphics Synthesizer die. Not addressable as main memory.
        measurementIds:
