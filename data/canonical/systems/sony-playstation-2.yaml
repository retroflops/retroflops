id: sony-playstation-2
slug: sony-playstation-2
name: Sony PlayStation 2
aliases:
  - PS2
manufacturer: Sony Computer Entertainment
type: console
family: sony-playstation
releaseDate: 2000-03
region: Worldwide
summary: >-
  A {{measurement:sony-playstation-2:cpu-clock-frequency}} Emotion Engine rated
  at 6.2 GFLOPS, {{measurement:ps2-main-rdram:capacity}} of Rambus main memory
  at {{measurement:ps2-main-rdram:bandwidth}}, and a rasterizer whose
  {{measurement:ps2-gs-edram:capacity}} frame buffer sits on the die behind a
  {{measurement:ps2-gs-edram:bus-width}} bus.
description: >-
  The PlayStation 2 is the first record in this catalog where the graphics
  chip's memory is fifteen times faster than the console's main memory, on
  Sony's own figures. The machine's design follows from that asymmetry. Geometry
  runs on the Emotion Engine's two vector units, which is where its 6.2 GFLOPS
  mostly comes from; the Graphics Synthesizer only rasterizes, but does so
  against a frame buffer it never has to leave the die to reach. It has little
  room: {{measurement:ps2-gs-edram:capacity}} holds the frame buffer, the Z
  buffer and whatever textures fit alongside them, so texture data streams in
  from main memory while drawing proceeds.


  Its numbers come from Sony press releases rather than the developer manuals.
  The EE Overview, EE User's and GS User's manuals describe the caches, bus
  widths, vector units and memory map, but state neither the processor clock,
  the installed memory size nor a floating-point rate. SCEI published those
  three figures in a specification table a year before launch, then corrected
  the clock in a later release.
