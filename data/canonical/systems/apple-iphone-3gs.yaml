name: Apple iPhone 3GS
manufacturer: Apple
type: smartphone
family: apple-iphone
releaseDate: 2009-06-19
region: Worldwide
summary: >-
  The S was for speed. Samsung's S5PC100 and PowerVR SGX535 graphics in the body
  of the 3G, plus a compass and the first iPhone that could record video.
description: >-
  Apple's specification for the 3GS names the chip and lists what the phone was
  sold in, and gives no clock, no installed memory and no power rating. Apple
  has never published those for any iPhone; the figures this catalog holds for
  the first-generation phone came from a teardown.
