type: handheld
family: nintendo-handheld
description: >-
  Nintendo introduced the DS as a third line beside the Game Boy rather than its
  replacement, and hedged by fitting a Game Boy Advance cartridge slot and the
  processor needed to use it. The hedge stopped being necessary quickly.
