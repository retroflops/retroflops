sourceIds:
  - nintendo-ds-technical-reference
summary: >-
  A handheld with two screens, the lower one a touch panel, plus a microphone
  and a wireless radio. Its display engines draw tiles and sprites in the manner
  of the Game Boy Advance.
imageIds:
