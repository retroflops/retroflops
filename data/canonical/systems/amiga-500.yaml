id: amiga-500
slug: amiga-500
name: Commodore Amiga 500
manufacturer: Commodore-Amiga, Inc.
type: home-computer
family: commodore-amiga
releaseDate: '1987'
region: Worldwide
summary: >-
  A 68000 at around {{measurement:amiga-500:pal:clock-frequency}} with the
  Original Chip Set handling graphics, audio and I/O in parallel with the
  processor, and memory shared between them.
description: >-
  The Amiga 500 shows why a processor clock alone says little. Its 68000 runs at
  {{context:amiga-500:context-mhz-7-09379}} on PAL machines and
  {{context:amiga-500:context-mhz-7-15909}} on NTSC ones. Both derive, like the
  Commodore 64's, from the video crystal rather than from a frequency chosen for
  the CPU. The custom chips work directly on memory while the processor does
  something else: Agnus runs the blitter and copper, Denise drives the display
  and sprites, and Paula handles audio and I/O. That architecture is also why
  memory is recorded here as two separate figures. Chip memory is what the
  custom chips can reach; Fast memory is what only the CPU can see. A single
  "RAM" number for an Amiga hides the distinction that determines what the
  machine can display and play.
