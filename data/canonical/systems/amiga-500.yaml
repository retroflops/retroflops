notes: >-
  The release date is editorial context; the cited manual documents the hardware
  without dating the model's launch. The manual is the 1991 third edition, whose
  table of memory configurations describes a later base machine than the
  {{measurement:amiga-500-chip-ram:capacity}} Amiga 500 of 1987. The figures
  recorded here identify the column they came from.
