summary: >-
  The A9 with PowerVR Series7XT graphics, and a display that measured how hard
  it was pressed. 3D Touch was the headline feature of exactly one generation.
description: >-
  Pressure sensing was dropped from later phones and replaced with a timed long
  press, which makes the 6s a rare case of iPhone hardware being removed rather
  than improved.
