id: nvidia-geforce-256
slug: nvidia-geforce-256
name: NVIDIA GeForce 256
manufacturer: NVIDIA
type: accelerator
family: nvidia-geforce
releaseDate: 1999-10
region: Worldwide
summary: >-
  The card NVIDIA sold as the first GPU, moving transform and lighting off the
  processor and onto the board. It shipped first with SDR memory and later with
  DDR.
description: >-
  NVIDIA sold the GeForce 256 as the first GPU, on the strength of moving
  transform and lighting off the processor and onto the card. The marketing word
  outlasted the argument it was coined for, but the shift underneath it held:
  geometry work that had belonged to the CPU now ran beside rasterization.
