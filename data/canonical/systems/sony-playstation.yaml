summary: >-
  A {{measurement:sony-playstation:clock-frequency}} customized R3000A with
  {{measurement:psx-main-ram:capacity}} of main memory,
  {{measurement:psx-vram:capacity}} of video memory, and the 3D work split
  between a geometry coprocessor and a drawing processor.
description: >-
  The PlayStation divides its 3D work among components rather than leaving it
  with the processor. Its CPU is a customized R3000A at
  {{measurement:sony-playstation:clock-frequency}}. The GTE, a coprocessor
  beside the integer core, handles coordinate transformation and lighting; a
  separate GPU with its own memory handles drawing. No single component's
  specification describes the console, so the record models four of them and
  shows how the work is divided.


  It is also the first console here. Consoles differ from the home computers
  that precede them. The Commodore 64 and the Amigas take their clock from the
  television standard, so PAL and NTSC machines run at different speeds. The
  PlayStation's clock is the same everywhere, so it has one configuration rather
  than two.
configurations:
