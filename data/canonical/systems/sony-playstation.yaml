notes: >-
  The release date is editorial context; the cited developer reference documents
  the hardware without dating the launch. That reference is the August 1998
  revision, four years after release, but it describes the same retail hardware.
  No floating-point figure is recorded: the reference does not describe
  floating-point hardware on this processor, and inferring its absence would be
  a claim without a citation.
