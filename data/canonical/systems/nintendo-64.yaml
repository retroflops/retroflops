releaseDate: 1996-06
region: Worldwide
summary: >-
  A {{measurement:nintendo-64:cpu-clock-frequency}} R4300 beside the Reality
  Coprocessor, with {{measurement:n64-rdram:capacity}} of RDRAM shared between
  processor, geometry engine and rasterizer rather than split into system and
  video memory.
description: >-
  The Nintendo 64 differs from the PlayStation in two architectural respects.
  Its memory is unified: one RDRAM pool is used in parallel by the CPU, the RSP
  microcode engine, the RDP graphics pipeline and the I/O interfaces. The
  PlayStation keeps {{context:nintendo-64:context-mib-2}} of main memory and
  {{context:nintendo-64:context-mib-1}} of video memory in separate pools
  connected only by DMA. Its geometry stage is also programmable. The RSP runs
  microcode, so software rather than fixed silicon determines what the machine
  does with a triangle.


  Those choices make the capacity figures harder to compare than they look. Four
  megabytes shared between everything is not four megabytes of system memory,
  and the machine that has to hold textures in the same pool as game state makes
  a different trade from one with a dedicated frame buffer.
