notes: >-
  The release date is editorial context; the cited manual is an October 1996
  draft and does not date the launch. The scan of that manual is badly degraded,
  so no RDRAM clock or bandwidth figure is recorded: the clock-speed list gives
  an RDRAM entry that can only be reconstructed from the letterforms, and a
  figure that has to be guessed at is not published. The Expansion Pak that
  doubles main memory to {{context:nintendo-64:context-mib-8}} is not recorded
  either, for want of a citation in this document.
