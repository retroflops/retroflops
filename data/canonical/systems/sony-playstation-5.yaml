manufacturer: Sony Interactive Entertainment
type: console
family: sony-playstation
releaseDate: 2020-11
region: Worldwide
summary: >-
  Eight Zen {{context:sony-playstation-5:context-unit-2}} cores to
  {{measurement:sony-playstation-5:cpu-peak-clock}}, an RDNA 2 graphics engine
  to {{measurement:sony-playstation-5:gpu-peak-clock}} and
  {{measurement:ps5-gpu:peak-fp32-rate}}, and {{measurement:ps5-gddr6:capacity}}
  shared at {{measurement:ps5-gddr6:bandwidth}}. The specification gives no
  fixed frequency.
description: >-
  This record completes a line of five consoles from the same maker, released
  from 1994 to 2020 and described in five different vocabularies.


  The PlayStation and PlayStation 2 are described by frequency. The PlayStation
  3 adds a floating-point rate. The PlayStation 4 drops frequency entirely and
  gives core counts and teraflops. The PlayStation 5 states frequencies but also
  says they are not constants. "Variable frequency, up to 3.5 GHz" is a
  different quantity from a nominal clock: it is a ceiling reached when power
  and heat allow. It cannot share a row with the PlayStation 2's
  {{context:sony-playstation-5:context-mhz-294-912}}, because the two figures
  answer different questions. This machine's nominal clock is therefore recorded
  as not-applicable, and its ceiling is recorded under a method shared with
  GeForce boost clocks.


  Everything here is provisional because Sony's only specification table for
  this console went up eight months before it shipped and has been edited since.
  The graphics rate now reads {{measurement:ps5-gpu:peak-fp32-rate}} where it
  once read 10.28, and the compute-unit count it once carried is gone. A figure
  from a document that is still changing remains provisional.
imageIds:
