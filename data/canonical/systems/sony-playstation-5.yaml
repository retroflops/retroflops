configurations:
  - id: launch
    label: Launch console
    releaseDate: 2020-11
    entries:
      - componentId: ps5-cpu
        role: main-cpu
        count: 1
        shared: false
        notes: >-
          {{context:ps5-cpu:context-unit-8}} cores,
          {{context:ps5-cpu:context-unit-16}} threads. The frequency is a
          ceiling: Sony specifies it as variable.
        measurementIds:
          - sony-playstation-5:cpu-clock-frequency
          - sony-playstation-5:cpu-peak-clock
      - componentId: ps5-gpu
        role: gpu
        count: 1
        shared: false
        notes:
          Also a ceiling, and also variable. Sony states no compute-unit count.
        measurementIds:
          - sony-playstation-5:gpu-clock-frequency
          - sony-playstation-5:gpu-peak-clock
      - componentId: ps5-gddr6
        role: unified-memory
        count: 1
        shared: true
        notes: >-
          Sony's own heading is "System Memory": one pool for the processor and
          the graphics engine.
        measurementIds:
          - ps5-gddr6:capacity
      - componentId: ps5-ssd
        role: storage
        count: 1
        shared: false
        notes: >-
          Read decimally. 825 is not a power of two and was never meant to be
          read as one.
        measurementIds:
          - sony-playstation-5:storage-capacity
notes: >-
  The release date is editorial context: the cited table predates the console by
  eight months and states no date. The digital edition, which differs only in
  the optical drive, is not recorded as a second configuration because it
  carries no different figure. Three things in Sony's table are deliberately not
  recorded: the SSD's {{context:sony-playstation-5:context-gb-s-5-5}} read
  bandwidth, which is a storage rate rather than the memory-bandwidth metric;
  the disc capacity, which describes a medium rather than the machine; and the
  audio engine, which the catalog has no metric for. No power figure is recorded
  because Sony publishes none.
sourceIds:
