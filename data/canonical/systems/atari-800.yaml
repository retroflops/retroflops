summary: >-
  An Atari {{context:atari-800-6502:context-bit-8}} computer whose 6502 clock
  follows PAL or NTSC video timing.
description: >-
  PAL and NTSC are configurations of the same Atari 800, not different systems.
  The record retains their distinct CPU clocks while keeping RAM and ROM as
  separate memory roles; only writable RAM enters the whole-system total.
