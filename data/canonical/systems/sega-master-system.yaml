id: sega-master-system
manufacturer: Sega
name: Sega Master System
notes: Removable cartridge ROM is storage, not whole-system working memory.
region: North America
releaseDate: 1986-06
slug: sega-master-system
imageIds:
  - sega-master-system-console
sourceIds:
  - sega-8bit-service-manual
summary: >-
  A Z80 console with a tile-and-sprite VDP descended from the TMS9918. It lost
  to Nintendo in Japan and North America, then outsold it in Brazil and parts of
  Europe for years afterward.
type: console
family: sega-console
description: >-
  Sega built the Master System on the processor and video lineage it already
  used in the arcades, which made conversions straightforward. Its long
  afterlife came from licensing: Tec Toy kept manufacturing and selling the
  console in Brazil long after Sega had moved on.
