releaseDate: 2010-06-24
region: Worldwide
summary: >-
  Apple's first in-house A4, PowerVR SGX535 graphics, a glass-and-steel body and
  the Retina display that made pixel density a selling point.
description: >-
  The stainless frame doubled as the antenna, which is why holding the phone
  across its lower left corner could drop a call. Apple replaced the plastic
  back with glass on both faces, and spent the next decade dealing with the
  consequences.
