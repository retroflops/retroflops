notes: >-
  The release date is the date of the cited launch article. The configuration is
  labeled a reference card on editorial grounds: NVIDIA's table describes the
  card it built, and partner boards ship with clocks of their own that this
  record does not cover. The texel fill rate is not recorded because the catalog
  has no metric for it. The recommended system power is also excluded because it
  describes a computer this record does not contain.
