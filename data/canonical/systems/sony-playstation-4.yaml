manufacturer: Sony Computer Entertainment
type: console
family: sony-playstation
releaseDate: 2013-11
region: Worldwide
summary: >-
  Eight x86-64 cores and {{context:sony-playstation-4:context-unit-18}} compute
  units on one die, rated at {{measurement:ps4-gpu:peak-fp32-rate}} and sharing
  {{measurement:ps4-gddr5:capacity}} of GDDR5 in one memory pool.
description: >-
  This record differs from the three earlier PlayStations in two ways.


  The memory is one pool. The PlayStation kept
  {{context:sony-playstation-4:context-mib-2}} for the processor and
  {{context:sony-playstation-4:context-mib-1}} for the drawing chip; the
  PlayStation 2 kept {{context:sony-playstation-4:context-mib-32}} and
  {{context:sony-playstation-4:context-mib-4}}; the PlayStation 3 kept
  {{context:sony-playstation-4:context-mib-256}} and
  {{context:sony-playstation-4:context-mib-256}}. Each pair has to remain two
  numbers because neither half can be spent on the other's work. The PlayStation
  4's {{measurement:ps4-gddr5:capacity}} is unified, so its memory capacity is
  one figure.


  Sony never published either clock. The introduction gives a core count, a
  compute-unit count, a teraflops figure and bandwidth, but no frequency; the
  launch-day release repeats only the memory. Everything except the memory
  capacity is provisional pre-launch evidence, as with the PlayStation 3's
  announced figures.
