notes: >-
  The release date and the hour come from Apple's retail-availability release of
  28 June 2007. The {{context:apple-iphone-1st-generation:context-gb-16}} model
  added in February 2008 is not recorded: it is a later configuration of the
  same machine and adds no quantity this record does not already carry. The
  battery figures Apple publishes, talk time and standby time, are durations
  under unstated conditions rather than a power draw, so no power figure is
  recorded for the machine.
