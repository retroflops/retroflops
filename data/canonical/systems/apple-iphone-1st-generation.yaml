id: apple-iphone-1st-generation
slug: apple-iphone-1st-generation
name: Apple iPhone (1st generation)
manufacturer: Apple
type: smartphone
family: apple-iphone
releaseDate: 2007-06-29
region: United States
summary: >-
  One ARM11 core at
  {{measurement:apple-iphone-1st-generation:cpu-clock-frequency-independent}}, a
  graphics core with no published frequency, and
  {{measurement:iphone-dram:capacity}} of memory in a phone sold by its four or
  eight gigabytes of storage.
description: >-
  The first telephone in this catalog is also the first record where the number
  on the box does not describe the machine's working memory. Apple sold the
  iPhone as a {{context:apple-iphone-1st-generation:context-gb-4}} model and an
  {{context:apple-iphone-1st-generation:context-gb-8}} model. Both figures are
  flash storage. The memory used to run programs is
  {{measurement:iphone-dram:capacity}}, which Apple never mentioned; it appears
  here because somebody took the phone apart and wrote it down.


  Apple's two press releases give a price, a capacity, a screen size and a
  camera, but no processor, frequency or memory. The clock, the core, the
  graphics part and the memory all come from one independent analysis published
  two years later. Because it is one analysis rather than two, every figure it
  supports is provisional. The catalog's rule is a tier A source or two agreeing
  tier B ones; the vendor's silence does not lower the bar.


  The analysis does not guess. It gives the processor as
  {{measurement:apple-iphone-1st-generation:cpu-clock-frequency-independent}}
  and says plainly that it does not know the graphics core's frequency. That
  sentence is the evidence for the graphics clock, and it is the reason there is
  no figure to give.
