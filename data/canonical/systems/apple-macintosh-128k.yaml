releaseDate: 1984-01
region: United States
summary: >-
  The original Macintosh: a 68000, a built-in monochrome display, and a Toolbox
  ROM holding the routines that drew the interface.
description: >-
  The compact Macintosh shares its small pool of memory with the monochrome
  display, so the picture on screen and the program drawing it compete for the
  same chips. Its Toolbox ROM holds the interface routines and cannot be written
  to, which is why it is counted apart from working memory.
