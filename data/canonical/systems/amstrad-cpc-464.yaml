name: Amstrad CPC 464
manufacturer: Amstrad
type: home-computer
releaseDate: 1984-06
region: United Kingdom
summary: >-
  A Z80A home computer sold as a complete set, with Locomotive BASIC in ROM, a
  cassette deck built into the keyboard and its own monitor.
description: >-
  Amstrad sold the CPC as one box at a time when rivals expected the buyer to
  supply a television and a tape recorder. The monitor carried the power supply
  for the whole machine, so the two parts were not separable.
