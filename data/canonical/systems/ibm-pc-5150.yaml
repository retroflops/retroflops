id: ibm-pc-5150
slug: ibm-pc-5150
name: IBM Personal Computer 5150
manufacturer: IBM
type: personal-computer
releaseDate: 1981-08
region: United States
summary: >-
  IBM's original PC: an 8088 at {{measurement:ibm-pc-5150:clock-frequency}} and
  a selected {{measurement:ibm-pc-5150-ram:capacity}} base-memory configuration.
description: >-
  The 5150's BIOS and Cassette BASIC live in ROM, so the record keeps the
  read-only capacity separate from base RAM and excludes it from whole-system
  writable memory.
