notes: >-
  The release date is editorial context: neither cited document carries a
  publication date. The configuration is labeled a reference card for the same
  reason as the GeForce GTX 1080's. Partner boards carry clocks of their own.
  The tensor and ray-tracing rates, the fill rates and the required system power
  are not recorded because the catalog has no metric that would make them
  comparable with anything. The whitepaper's non-tensor FP16 and INT32 peaks are
  omitted for the same reason as the H100's BFLOAT16 and FP8 rates.
sourceIds:
