id: amiga-1200
slug: amiga-1200
name: Commodore Amiga 1200
manufacturer: Commodore Business Machines
type: home-computer
family: commodore-amiga
releaseDate: 1992-10
region: Worldwide
summary: >-
  A 68EC020 at around {{measurement:amiga-1200:pal:clock-frequency}} with the
  AGA chipset and {{measurement:amiga-1200-chip-ram:capacity}} of
  {{context:motorola-68ec020:context-bit-32}} Chip memory.
description: >-
  The Amiga 1200 is a useful counterpart to the Amiga 500 because the two differ
  in more than clock rate. The 68EC020 runs at roughly twice the 500's
  frequency. Both clocks derive from the same video crystals, halved rather than
  quartered. It also has a {{context:motorola-68ec020:context-bit-32}} data path
  where the 68000 had 16, an instruction cache, and single-access operations
  where the 68000 needed two. Comparing the machines on megahertz alone would
  miss most of what changed. Chip memory is
  {{context:motorola-68ec020:context-bit-32}} wide and organized as 256K by 32,
  and the AGA chipset reaching it replaced the Original Chip Set. Floating point
  remained absent by default; the socket for a 68881 or 68882 was factory-fit
  only.
