notes: >-
  The release date is editorial context; the cited service manual documents the
  hardware without dating the launch. The scanned text of that manual is
  unreliable in places. It confuses 3 with 8, so every figure taken from it was
  cross-checked against the base crystal frequencies in the Amiga Hardware
  Reference Manual.
