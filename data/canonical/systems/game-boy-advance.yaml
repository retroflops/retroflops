region: Japan
releaseDate: 2001-03
slug: game-boy-advance
sourceIds:
  - game-boy-advance-technical-manual
summary: >-
  An ARM7TDMI handheld that kept the Game Boy's tile and sprite hardware and
  added bitmap modes, so it could run its predecessor's cartridges as well as
  its own.
imageIds:
  - game-boy-advance-handheld
type: handheld
family: nintendo-handheld
description: >-
  The GBA carries a second, older processor alongside the ARM, so Game Boy
  cartridges run on the silicon they were written for. The compatibility is in
  the hardware, and a Game Boy game is not being emulated when it runs here.
