id: apple-ii
slug: apple-ii
name: Apple II
manufacturer: Apple Computer
type: home-computer
releaseDate: 1977-06
region: United States
summary: >-
  A {{measurement:apple-ii:clock-frequency}} 6502 home computer with
  configuration-dependent motherboard RAM and ROM-resident Integer BASIC.
description: >-
  The January 1978 manual leaves the fitted RAM amount to the purchased
  configuration, so this record does not select a capacity. Its
  {{measurement:apple-ii-rom:capacity}} monitor and Integer BASIC ROM is named
  separately and is not writable memory.
configurations:
  - id: ram-unspecified
    label: Configuration with unspecified RAM
    region: United States
    entries:
      - componentId: apple-ii-6502
        role: main-cpu
        count: 1
        shared: false
        measurementIds:
          - apple-ii:clock-frequency
      - componentId: apple-ii-video
        role: gpu
        count: 1
        shared: false
        measurementIds:
          - apple-ii:gpu-clock-frequency
      - componentId: apple-ii-ram
        role: system-memory
        count: 1
        shared: true
        measurementIds:
          - apple-ii-ram:capacity
      - componentId: apple-ii-rom
        role: system-memory
        count: 1
        shared: true
        notes:
          Read-only monitor and Integer BASIC; not included in writable memory.
        measurementIds:
          - apple-ii-rom:capacity
imageIds:
  - apple-ii-computer
sourceIds:
