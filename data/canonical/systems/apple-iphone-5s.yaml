name: Apple iPhone 5s
manufacturer: Apple
type: smartphone
family: apple-iphone
releaseDate: 2013-09-20
region: Worldwide
summary: >-
  The A7 doubled the processor's word size, taking phones there a year before
  the rest of the industry followed. Touch ID and a separate motion coprocessor
  arrived with it.
description: >-
  Moving on word size ahead of the market caught competitors flat, and
  Qualcomm's answer did not ship until the following year. Touch ID mattered as
  much commercially: it made a passcode something people would actually set.
