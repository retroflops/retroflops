id: nec-pc-engine
manufacturer: NEC Home Electronics
name: NEC PC Engine
notes: HuCards are removable program storage and excluded from the memory total.
region: Japan
releaseDate: 1987-10
slug: nec-pc-engine
imageIds:
  - nec-pc-engine-console
sourceIds:
  - nec-pc-engine-technical-manual
summary: >-
  A HuC6280 console with a tile-and-sprite video chip, built small enough to sit
  in one hand and loading games from credit-card-sized HuCards.
type: console
description: >-
  NEC and Hudson Soft divided the work, Hudson designing the processor and video
  hardware and NEC building and selling the machine. It sits awkwardly between
  console generations, pairing a processor from the earlier one with graphics
  that outclassed everything sold beside it.
