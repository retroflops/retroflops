description: >-
  Docked and handheld operation are separate configurations. Their different GPU
  rates are not silently collapsed into one nominal clock. Nintendo publishes
  neither rate, nor any frequency at all: the figures here are independent
  reporting, and the catalog records the vendor's silence beside them rather
  than instead of them.
