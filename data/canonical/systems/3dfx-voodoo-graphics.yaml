id: 3dfx-voodoo-graphics
slug: 3dfx-voodoo-graphics
name: 3dfx Voodoo Graphics
manufacturer: 3dfx Interactive
type: accelerator
releaseDate: 1996-11
region: Worldwide
summary: >-
  The card that made 3D acceleration ordinary on a home PC, running a
  fixed-function pipeline of its own and leaving 2D to whatever adapter was
  already fitted.
description: >-
  Voodoo Graphics drew only 3D. It sat beside an ordinary 2D card and took the
  screen over when a game started, which is why a machine fitted with one needed
  both boards and a short pass-through cable between them.
