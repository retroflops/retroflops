notes: >-
  The release date is editorial context as the catalog defines it, but it is
  unusually well attested here: the launch specification is titled with the
  date. The 2005 announcement's "System Floating Point Performance: 2 TFLOPS" is
  not recorded because it sums a CPU figure and a GPU figure into one number.
  The catalog has no metric that spans both scopes. No derived claim compares
  the two memory bandwidths, although both are stated, because the ratio formula
  declines provisional inputs.
