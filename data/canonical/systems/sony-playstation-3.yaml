summary: >-
  A Cell processor with seven vector co-processors and an NVIDIA-derived RSX,
  each with {{measurement:ps3-xdr:capacity}} of memory. Sony never restated its
  clocks or floating-point figures for shipping hardware.
description: >-
  Every figure on this record comes from one of two Sony specifications, and
  which of the two decides how far the figure can be trusted.


  The announcement of May 2005 is a full table: a
  {{context:sony-playstation-3:context-ghz-3-2}} PowerPC core, seven SPEs at the
  same clock, 218 GFLOPS between them, an RSX at
  {{context:sony-playstation-3:context-mhz-550}} claimed at 1.8 TFLOPS, and 2
  TFLOPS for the system. The launch specification of May 2006 describes the
  console that shipped, and states none of it. It names the Cell processor and
  the RSX without a clock for either, gives no floating-point figure at all, and
  repeats only the memory: {{context:sony-playstation-3:context-mb-256}} of XDR
  and {{context:sony-playstation-3:context-mb-256}} of GDDR3.


  So the two memory capacities are approved and everything else is provisional.
  Not because any particular number is doubted, but because a company that has
  finished the hardware declined to restate what it said before it had. Those
  figures are recorded as pre-launch evidence. That does not move them into a
  comparability group of their own: an announced clock is still a nominal clock,
  and it stands in the same row as the clock of a machine that shipped, where a
  reader can see both. What it does is keep them provisional, and a provisional
  record never feeds an automatic multiplier.
