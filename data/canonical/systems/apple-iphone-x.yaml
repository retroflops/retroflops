summary: >-
  The iPhone that lost the home button: an edge-to-edge OLED display, face
  recognition in place of a fingerprint reader, and the A11 Bionic behind both.
description: >-
  The notch housed the projector and infrared camera that made face recognition
  work, and set the shape of every iPhone for years afterward. It was also the
  first iPhone to reach a thousand dollars.
