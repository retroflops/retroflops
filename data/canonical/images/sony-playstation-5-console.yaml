  note: "The original is a portrait photograph and the console stands the full height of it with its
    controller in front, so no 4:3 crop keeps the machine whole — and a crop may not take the
    controller either. The recipe therefore pads: the photograph lands in the middle of the frame at
    its own proportions and the margin is a flat tone sampled from the surface the console stands
    on. It is the shape of the object rather than a failure of the picture; every photograph of
    these two consoles is portrait, because both are tall boxes."
