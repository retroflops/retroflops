notes:
  Apple's phrase is "the GPU in M1", so this is a section of a die rather than a
  separate part; it is a component of its own here because the catalog's kinds
  are `cpu`, `gpu` and `memory` and one record cannot carry both a core count
  and a graphics-core count.
