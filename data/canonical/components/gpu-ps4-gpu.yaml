notes:
  Sony gives the compute-unit count but no clock, so the teraflops figure cannot
  be reconstructed from the parts — which is the reverse of the usual problem,
  where the clock is published and the unit count is not. Both this and the
  PlayStation 3's RSX figure are provisional; the difference is that here the
  source at least states what the units are.
