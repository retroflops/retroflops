id: amiga-1200-chip-ram
slug: amiga-1200-chip-ram
kind: memory
name: Amiga 1200 Chip memory
manufacturer: Commodore Business Machines
architecture: Shared 32-bit dynamic RAM
introducedDate: '1992'
memoryType: 32-bit dynamic RAM shared between the CPU and the custom chips
summary:
  Chip memory organized as 256K by
  {{context:amiga-1200-chip-ram:context-bit-32}}, reachable by both the 68EC020
  and the AGA chipset. Four times the Amiga 500's, and
  {{context:amiga-1200-chip-ram:context-bit-32}} wide rather than 16.
notes:
  Shipped as {{context:amiga-1200-chip-ram:context-mb-1}} on the motherboard,
  expandable to {{context:amiga-1200-chip-ram:context-mb-2}}; the service manual
  records that systems were by then configured with
  {{context:amiga-1200-chip-ram:context-mb-2}} as standard. Fast memory, which
  the custom chips cannot see, is a separate expansion.
sourceIds:
  - amiga-1200-service-manual
editorialStatus: approved
