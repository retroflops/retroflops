- caveat: >-
    Intel's rating of the Core i9-14900K's memory interface, not a property of
    any fitted module and not a measurement of traffic across it. It describes
    the faster of the two memory types that processor accepts: the same
    specification offers DDR4-3200, at which the interface reaches less. This is
    the one component in the x86 line whose figure is safe to state, because
    only one machine in the catalog is fitted with it. The DDR, DDR2 and DDR3
    components shared across earlier machines have no equivalent single answer.
