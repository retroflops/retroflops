- caveat: >-
    A ceiling, not a rate the machine holds: Sony's words are "Variable
    frequency, up to 3.5 GHz", and how often the processor reaches it depends on
    what the graphics engine is drawing at the same time. It shares a
    comparability group with the GeForce cards' boost clocks, which are the same
    kind of claim, and shares none with the fixed clocks of the four
    PlayStations before it. Provisional because the only document that states it
    went up eight months before the console shipped and has been edited since.
  comparabilityGroup: clock-frequency|cpu|peak-clock
