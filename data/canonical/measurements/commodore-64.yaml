  quantity:
    note: >-
      No acceptable source states one, and there is no single correct answer to
      state: 6502 instructions take between two and seven cycles depending on
      the instruction and its addressing mode, so an instruction rate exists
      only for a specific mix of instructions. Dividing the clock by one cycle
      per instruction — the usual shortcut to "about 1 MIPS" — describes no real
      workload.
    state: unknown
