- benchmark:
    id: dhrystone
    version: "1.1"
  caveat: >-
    The first Dhrystone figure in this catalog, and it is provisional because
    one collection states it and the policy asks for two independent sources.
    Read it as what it is: a score against the VAX-11/780, not a count of
    anything this machine executes. {{measurement:commodore-64:dhrystone-mips}}
    does not mean twenty thousand instructions per second. It is also version
    1.1, which was withdrawn precisely because compilers optimized it away, so
    it may not be divided by a version 2.1 figure; the benchmark identity
    refuses that automatically.
