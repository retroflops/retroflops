- comparabilityGroup: memory-bandwidth|memory|theoretical-peak
  caveat: >-
    Divides bytes transferred by one processor memory cycle by the published
    memory cycle time. The result is an interface ceiling when a manual
    specifies nanoseconds per byte instead of a transfer rate. It is not
    measured application throughput: refresh, contention and wait states can
    consume cycles. Reported to 3 significant digits. That is the precision of
    the cycle time, because the bytes-per-cycle constant is exact.
  derivedFrom: ibm-pc-5150:memory-bandwidth-from-cycle-time
  editorialStatus: approved
  evidenceStage: shipped
