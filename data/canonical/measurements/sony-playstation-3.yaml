- caveat: >-
    The weakest figure on this record. No precision, no shader-unit count and no
    operations-per-cycle are stated, so it cannot be reconciled with the
    {{context:ps3-rsx:context-mhz-550}} quoted beside it, and no later Sony
    document repeats it. It is recorded because the source states it and
    withheld from every automatic multiplier because nothing about it can be
    checked. Reviewed again against the instruction manual printed for the
    console that shipped (CECHA01, 2006): its specification table names the Cell
    and the RSX without a frequency for either and both memories without a
    transfer rate, so no post-launch Sony document corroborates this figure and
    it stays provisional. It also cannot be read as the same claim as the
    PlayStation 4's {{context:ps3-rsx:context-tflop-s-1-84}}: the PlayStation
    4's reconstructs exactly from the compute units its own source names,
    counting the fused multiply-add each shader lane issues per cycle, and this
    one reconstructs from nothing. They share a comparability group because both
    are a vendor's theoretical peak for a graphics processor, which is as far as
    the group can see: it cannot tell that the two are counting different
    operations. A search for a checkable figure to set against this one found
    nothing usable: the rates that circulate for the RSX disagree with each
    other by more than a factor of two and every one of them traces back to a
    wiki or a forum, so there is no A source and no pair of agreeing B sources
    to record a conflict against.
  comparabilityGroup: peak-fp32-rate|gpu|theoretical-peak
