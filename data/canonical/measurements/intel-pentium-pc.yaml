- caveat: >-
    Intel's word for this in 1997 was not "thermal design power" but "maximum
    active power dissipation", the figure the datasheet says a system must be
    designed to remove. It is the same design target the later term names, and
    it is recorded here as such, but it is defined by a worst-case instruction
    mix rather than a reproducible workload, so it sits at the top of what the
    part draws rather than in the middle. The
    {{context:intel-pentium:context-w-3-9}} typical on the same row is an
    average measured in one system and is not a specification.
  comparabilityGroup: thermal-design-power|cpu|rated-power
  conditions: Maximum active power dissipation at
    {{measurement:intel-pentium:clock-frequency}}, VCC =
    {{context:intel-pentium:context-v-3-3}}, worst-case instruction mix; the
    datasheet's typical in-system figure for the same part is
    {{context:intel-pentium:context-w-3-9}}.
  editorialStatus: approved
