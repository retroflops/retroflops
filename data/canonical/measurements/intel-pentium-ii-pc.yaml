- caveat: >-
    Intel's Max Processor Power, which the datasheet defines as 100% of the core
    and 100% of the L2 cache. It is not the Max Thermal Plate Power of
    {{context:intel-pentium-ii:context-w-41-4}} printed beside it, and it is
    specific to CPU ID 63x: the same table rates a
    {{context:intel-pentium-ii:context-mhz-266}} part at either
    {{context:intel-pentium-ii:context-w-38-2}} or
    {{context:intel-pentium-ii:context-w-19-5}} depending on stepping, and the
    faster {{context:intel-pentium-ii:context-mhz-333}} part at
    {{context:intel-pentium-ii:context-w-23-7}}, so this figure belongs to the
    0.35-micron silicon and cannot stand for every processor sold as a Pentium
    II 300.
  comparabilityGroup: thermal-design-power|cpu|rated-power
  conditions: Max Processor Power at
    {{measurement:intel-pentium-ii:clock-frequency}} with
    {{context:intel-pentium-ii:context-kb-512}} of L2 cache, CPU ID 63x, at
    nominal core and {{context:intel-pentium-ii:context-v-3-3}} L2 supply
    voltages.
  editorialStatus: approved
  evidenceStage: shipped
