- caveat: >-
    Computed here, not published anywhere. Nobody rated this processor in
    floating-point operations per second: a processor of 1996 was documented by
    what its units retire per cycle, and the manual says the adder and the
    multiplier each accept one operation every cycle and stops there. The
    multiplication is the derived claim this record names, with both constants
    cited to that manual. It is an upper bound twice over — every unit fed on
    every cycle, nothing stalling — and the same figure holds at double
    precision, because the manual gives the multiplier one repeat rate for both.
  comparabilityGroup: peak-fp32-rate|cpu|theoretical-peak
  conditions: One R10000 at {{context:mips-r10000:context-mhz-250}}, both
    floating-point units issuing on every cycle.
  derivedFrom: mips-r10000:peak-fp32-from-clock
  editorialStatus: approved
  evidenceStage: shipped
