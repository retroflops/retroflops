- benchmark:
    id: spec-cpu
    variant: cint-base
    version: "95"
  caveat: >-
    SPEC fair use applies to any quotation of this figure. Base and peak are
    different comparability groups: base results are run with one flag set
    across all benchmarks, peak results allow per-benchmark tuning, and the two
    are never interchangeable. Comparable only with other CINT95 base results,
    never with CPU2000 or later suites. SPEC publishes no conversion between
    suite generations.
  comparabilityGroup: spec-cpu-result|whole-system|spec-published-result|spec-cpu@95:cint-base
  conditions: IRIX64 6.4, MIPSpro C Compiler 7.2, base flags -Ofast=ip27
    -IPA:use_intrinsic with feedback-directed optimization. One
    {{measurement:sgi-octane:1x:clock-frequency}} R10000,
    {{measurement:sgi-octane:1x:memory-capacity}} of memory.
