- caveat: >-
    The first x86 part in this catalog whose datasheet prints a column headed
    Thermal Design Power, and the table is organized by bus rather than by
    clock: a {{measurement:intel-pentium-4:clock-frequency}} row exists only
    under the {{context:intel-pentium-4:context-mhz-800}} front side bus, which
    places this processor later than the 2002 the surrounding representative
    configuration is dated to. The 2002 flagship was
    {{context:intel-pentium-4:context-ghz-3-06}} on the
    {{context:intel-pentium-4:context-mhz-533}} bus, rated
    {{context:intel-pentium-4:context-w-81-8}} in the same table. That is near
    enough to 81.9 to be mistaken for corroboration, and it is a different
    processor. The catalog's representative year is unresolved against Intel's
    product chronology and needs its own document.
  comparabilityGroup: thermal-design-power|cpu|rated-power
  conditions: "{{measurement:intel-pentium-4:clock-frequency}} with an
    {{context:intel-pentium-4:context-mhz-800}} front side bus and
    {{context:intel-pentium-4:context-kb-512}} of L2 cache on the 0.13 micron
    process, in the multiple-VID group."
  editorialStatus: approved
