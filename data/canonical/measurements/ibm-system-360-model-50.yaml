- id: ibm-system-360-model-50:memory-bandwidth
  subject:
    kind: system
    id: ibm-system-360-model-50
    configurationId: 2050f
  metric: memory-bandwidth
  quantity:
    state: value
    value: '2.0'
    unit: MB/s
    significantDigits: 2
  scope: memory
  method: theoretical-peak
  provenance: vendor
  evidenceStage: shipped
  comparabilityGroup: memory-bandwidth|memory|theoretical-peak
  status: derived
  evidenceLevel: confirmed
  derivedFrom: ibm-system-360-model-50:memory-bandwidth-from-cycle-time
  rounding: half-up
  editorialStatus: approved
  sourceIds:
    - ibm-system-360-model-50-functional-characteristics
    - ibm-system-360-model-50-processor-controls
  extractIds:
    - ibm-system-360-model-50-functional-characteristics:main-storage-access
    - ibm-system-360-model-50-processor-controls:memory-cycle-time
  conditions: >-
    Main-storage data transfers only; excludes parity bits and optional external
    core storage.
  caveat: >-
    Divides bytes transferred by one main-storage cycle by the published memory
    cycle time. The result is an interface ceiling inferred from the transfer
    width and cycle time. It is not measured application throughput: refresh,
    contention and wait states can consume cycles. Reported to 2 significant
    digits. That is the precision of the cycle time, because the bytes-per-cycle
    constant is exact.
  normalized:
    value: "2000000"
    unit: B/s
    significantDigits: 2
    unitRegistry: units-v1
