- caveat: >-
    Provisional, like the graphics clock on the same page and for the same
    reason: the bullet this is read from is the one whose own clock figure the
    scan destroys, so a legible number on an illegible line waits for a second
    source. Note also what the manual counts: "9 bit bytes at 500 M/sec". The
    ninth bit is not the programmer’s, so this is 500 million bytes per second
    of data on a bus carrying rather more than that.
