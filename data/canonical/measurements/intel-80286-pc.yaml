- caveat: >-
    Kept unknown deliberately rather than for want of a document. Recording
    {{context:intel-80286:context-w-3-3}} here would publish an absolute-maximum
    stress rating as a thermal design power, which is the same error as reading
    a power-supply rating off a nameplate and calling it a draw. The figure is
    not even independent of the current beside it — 600 mA at the top of the
    {{context:intel-80286:context-v-5}} ±5% tolerance is
    {{context:intel-80286:context-w-3-15}} — so it is that ceiling rounded up.
    Anyone who quotes {{context:intel-80286:context-w-3-3}} for an 80286 is
    quoting this line.
  comparabilityGroup: thermal-design-power|cpu|rated-power
  editorialStatus: provisional
  evidenceStage: shipped
  id: intel-80286:thermal-design-power
  method: rated-power
  metric: thermal-design-power
  provenance: vendor
  quantity:
    note: >-
      The absence is real and now documented, and this is the one period x86
      part whose datasheet does print a wattage:
      {{context:intel-80286:context-w-3-3}}. It prints it under ABSOLUTE MAXIMUM
      RATINGS, beside a warning that these are stress ratings only and that
      operation beyond the Operating Conditions is not recommended — a limit
      past which the part is damaged, not a target a cooling solution is
      designed to. The operating specification for what this processor consumes
      is a current: 600 mA maximum at a 0°C turn-on.
    state: unknown
