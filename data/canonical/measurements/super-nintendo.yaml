- caveat: >-
    One of three rates this processor runs at. The 65816 takes a memory cycle at
    about 3.58, 2.68 or {{context:snes-5a22:context-mhz-1-79}} depending on
    which region it is addressing, so a single number describes the machine only
    once a region is named, and Nintendo names none. This is the middle rate,
    which is what the manufacturer chose to publish.
