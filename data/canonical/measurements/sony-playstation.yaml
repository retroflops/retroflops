    Not-applicable on a citation rather than on an inference. The catalog held
    nothing here because Sony’s reference never mentioned floating-point
    hardware, and absent evidence is not evidence of absence; the overview
    chapter does say what the engine computes in, which is the citation
    not-applicable needs. The console draws in three dimensions at speed and
    does it without a floating-point unit, which is why the wobbling geometry of
    the era looks the way it does.
