  provenance: vendor
  quantity:
    note: >-
      Nintendo does publish a floating-point figure for this console — 10,5
      GFLOPS (máximo) — and its own wording makes it a total across the
      processor, the geometry engine and the hardware lighting. A precision the
      publisher leaves unsaid is something this catalog now reads as single
      precision and carries as rumored, but an aggregate across unlike units is
      a different quantity, and no community article separates it. There is no
      standalone graphics rate to record.
