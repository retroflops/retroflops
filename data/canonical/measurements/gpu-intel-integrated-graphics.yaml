- caveat: >-
    This is a documented absence rather than an unexamined one. Two vendor
    specification records were read for the machines fitted with this component,
    and they answer the question differently in both directions: the older part
    has the higher base clock and the lower ceiling. What is missing is not a
    document but a component: the entry would need splitting into the named
    graphics devices, and the Core 2 Duo platform's chipset graphics is a third
    device the processor's own name does not identify.
