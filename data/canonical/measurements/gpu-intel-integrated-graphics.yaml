- caveat: >-
    A documented absence. The vendor record was read and states the unit count
    without the per-unit throughput that would turn it into a rate, and the
    component in any case spans graphics generations with different clocks, so
    one answer could not describe them even if the throughput were published.
  comparabilityGroup: peak-fp32-rate|gpu|theoretical-peak
  editorialStatus: provisional
  evidenceStage: shipped
  id: intel-integrated-graphics:peak-fp32-rate
  method: theoretical-peak
  metric: peak-fp32-rate
  provenance: vendor
  quantity:
    note: >-
      Intel's specification record for the newest of these graphics devices
      states an execution-unit count of 32 and no floating-point rate at any
      precision. An execution-unit count is not a rate: converting one to the
      other needs a published figure for floating-point operations per unit per
      clock, which the specification does not give.
    state: unknown
