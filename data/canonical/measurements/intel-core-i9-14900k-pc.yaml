- caveat: >-
    The rarest kind of gap: not a missing number but a number missing the one
    qualifier that would make it comparable. Intel's export filing answers a
    question its product specification never touches, and then leaves the
    precision unstated across all twenty-four pages. Recording it as an FP32
    peak would be a guess about which precision Intel meant, and the catalog
    does not publish those.
  comparabilityGroup: peak-fp32-rate|cpu|theoretical-peak
  editorialStatus: provisional
  evidenceStage: shipped
  id: intel-core-i9-14900k:peak-fp32-rate
  method: theoretical-peak
  metric: peak-fp32-rate
  provenance: vendor
  quantity:
    note: >-
      Intel does publish a floating-point rate for this processor — 1228.8
      GFLOPS, in the export-compliance matrix it maintains for the US Export
      Administration Regulations — and states no precision for it anywhere in
      that document. Without a precision the figure cannot answer a
      single-precision question, and it cannot be assumed to be one: the same
      1228.8 is listed for the faster-clocked 14900KS.
    state: unknown
  unknownAudit:
    reviewedOn: 2026-08-25
    routesChecked:
      - vendor-documentation
      - independent-analysis
      - community-source
    outcome: no-compatible-candidate
    summary: The checked application metrics provide no precision-qualified FP32 rate.
  scope: cpu
