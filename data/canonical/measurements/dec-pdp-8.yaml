- id: dec-pdp-8:rated-power-consumption
  subject:
    kind: system
    id: dec-pdp-8
    configurationId: standard-table-model
  metric: rated-power-consumption
  quantity:
    state: unknown
    note: >-
      DEC gives a power-dissipation figure without stating whether it includes
      the Teletype supplied with the standard installation.
  scope: whole-system
  method: rated-power
  provenance: vendor
  evidenceStage: shipped
  comparabilityGroup: rated-power-consumption|whole-system|rated-power
  status: vendor-rated
  editorialStatus: approved
  sourceIds:
    - dec-pdp-8-high-speed-digital-computer-1965
  extractIds:
    - dec-pdp-8-high-speed-digital-computer-1965:power-dissipation
    - dec-pdp-8-high-speed-digital-computer-1965:standard-teletype
  unknownAudit:
    reviewedOn: 2026-10-13
    routesChecked:
      - vendor-documentation
      - specialist-reference
      - community-source
    outcome: no-compatible-candidate
    summary: >-
      DEC's dissipation figure has no boundary statement for the standard
      Teletype. Gordon Bell's DEC timeline repeats the figure without resolving
      that boundary. The University of Amsterdam museum catalog describes the
      standard installation but states no power boundary. The figure cannot
      represent rated power for the full selected installation.
