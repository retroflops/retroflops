  scope: memory
  method: theoretical-peak
  provenance: vendor
  evidenceStage: shipped
  comparabilityGroup: memory-bandwidth|memory|theoretical-peak
  status: vendor-rated
  editorialStatus: approved
  sourceIds:
    - dec-pdp-8-high-speed-digital-computer-1965
  extractIds:
    - dec-pdp-8-high-speed-digital-computer-1965:data-break-rate
  unknownAudit:
    reviewedOn: 2026-10-13
    routesChecked:
      - vendor-documentation
      - community-source
    outcome: no-compatible-candidate
    summary: >-
      DEC states a data-break interval for transfers between a peripheral and
      the core. The University of Amsterdam museum describes memory-cycle
      timing, but neither source establishes an unrestricted bandwidth figure
      compatible with this metric.

