- id: dec-pdp-8-processor:addition-time
  subject:
    kind: component
    id: dec-pdp-8-processor
  metric: instruction-execution-time
  quantity:
    state: value
    value: '3.2'
    unit: us
    significantDigits: 2
  scope: cpu
  method: add-instruction
  provenance: vendor
  evidenceStage: shipped
  comparabilityGroup: instruction-execution-time|cpu|add-instruction
  status: vendor-rated
  evidenceLevel: confirmed
  editorialStatus: approved
  sourceIds:
    - dec-pdp-8-high-speed-digital-computer-1965
  extractIds:
    - dec-pdp-8-high-speed-digital-computer-1965:tad-instruction-time
    - dec-pdp-8-high-speed-digital-computer-1965:indirect-address-time
  conditions: Direct-address TAD Y instruction in DEC Table 1.
  caveat: >-
    The table's time is for direct addressing. Indirect addressing adds one
    computer cycle; this is an instruction time, not a processor clock.
  normalized:
    value: "0.0000032"
    unit: s
    significantDigits: 2
    unitRegistry: units-v1

