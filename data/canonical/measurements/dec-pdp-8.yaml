    configurationId: standard-table-model
  metric: memory-capacity-words
  quantity:
    state: value
    value: '4096'
    unit: word
    significantDigits: 4
  scope: whole-system
  method: design-capacity
  provenance: vendor
  evidenceStage: shipped
  comparabilityGroup: memory-capacity-words|whole-system|design-capacity
  status: vendor-rated
  evidenceLevel: confirmed
  editorialStatus: approved
  sourceIds:
    - dec-pdp-8-high-speed-digital-computer-1965
  extractIds:
    - dec-pdp-8-high-speed-digital-computer-1965:standard-components
    - dec-pdp-8-high-speed-digital-computer-1965:core-capacity
  conditions: Standard table-model configuration with its single fitted core.
  caveat: >-
    The standard configuration has one program-memory pool. Processor registers,
    the Teletype's paper tape, and optional memory extension are excluded. The
    source counts words of {{context:dec-pdp-8-core-memory:word-width}} each, so
    this figure is not a byte capacity. Word counts from machines with different
    word widths are not like-for-like bit-capacity comparisons.
  normalized:
    value: "4096"
    unit: word
    significantDigits: 4
    unitRegistry: units-v1

- id: dec-pdp-8:memory-bandwidth
