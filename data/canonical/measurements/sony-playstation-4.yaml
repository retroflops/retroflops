    Sony’s own word is "suggested": the figure is what Sony asked retailers to
    charge rather than what any buyer paid. The same release gives an identical
    numeral in Canadian dollars, which is a pricing decision and not a
    conversion, and is not recorded: the catalog holds one currency, and
    comparing across two would need a dated exchange rate that is a property of
    the date rather than of the console.
