- caveat: >-
    Checked against the part's own datasheet rather than against a general
    history. Intel specified this processor electrically, not thermally, so
    there is no figure to find: the maximum currents are on the page but not in
    its text layer, the scan's columns having detached from their rows, and even
    those are currents rather than a cooling-design target.
  comparabilityGroup: thermal-design-power|cpu|rated-power
  editorialStatus: provisional
  evidenceStage: shipped
  id: intel-80486dx:thermal-design-power
  method: rated-power
  metric: thermal-design-power
  provenance: vendor
  quantity:
    note: >-
      The absence is real and now documented. The datasheet's DC specifications
      give supply current in milliamps — typically 700 mA at
      {{measurement:intel-80486dx:clock-frequency}} — and state no wattage
      anywhere; the Absolute Maximum Ratings beside them cover temperature and
      voltage only. Multiplying current by the supply voltage would produce a
      watt figure Intel never published, from a typical rather than a design
      maximum.
    state: unknown
  unknownAudit:
