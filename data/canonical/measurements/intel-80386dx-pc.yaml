- caveat: >-
    Checked against the part's own datasheet rather than against a general
    history. What Intel published for this generation is an electrical limit,
    not a thermal-design target, and the two are different quantities however
    similar the arithmetic looks.
  comparabilityGroup: thermal-design-power|cpu|rated-power
  editorialStatus: provisional
  evidenceStage: shipped
  id: intel-80386dx:thermal-design-power
  method: rated-power
  metric: thermal-design-power
  provenance: vendor
  quantity:
    note: >-
      The absence is real and now documented. The datasheet's DC characteristics
      specify a supply current for each speed grade — 320 mA maximum against 240
      mA typical for the {{measurement:intel-80386dx:clock-frequency}} part —
      and no power figure. The current is quoted against a
      {{context:intel-80386dx:context-mhz-50}} CLK2 input, which is twice the
      processor's own frequency, so even the inputs to an unauthorized
      derivation are easy to misread.
    state: unknown
