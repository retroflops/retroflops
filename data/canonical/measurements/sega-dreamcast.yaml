- caveat: >-
    Held provisional because the source does not state a precision. The FPU row
    directly above it offers both single and double IEEE 754, and a
    floating-point rate without its precision is the single most common way
    hardware comparisons go wrong. Recorded here as single precision on the
    strength of the operation named, which is an editorial reading rather than a
    citation, so the figure stays out of automatic multipliers until a source
    states the precision outright.
