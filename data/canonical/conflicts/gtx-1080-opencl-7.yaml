decision:
  outcome: accepted
  candidateIndex: 0
  rationale:
    'The chart keys its rows on the string a driver reports, so one product
    reaches it under several names with several averages. The rule this catalog
    applies, here and in every later round: take the row that names the product
    as its maker names it, and treat a string carrying tokens the maker does not
    use — a “GPU” suffix, a die designation, another company’s prefix — as the
    driver’s name rather than the product’s. Both strings name the product; one
    carries the vendor prefix Nvidia itself uses and the other drops it. The
    prefixed row is taken, which is the same rule read the other way round:
    prefer the fuller name the maker writes. The rows reading “with Max-Q
    Design” are excluded from the comparison altogether, being a different
    product rather than a different name for this one.'
  decidedOn: 2026-08-18
